<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Turbofan look-dev</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #1b1c1e;
        overflow: hidden;
      }
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }
      #hud {
        position: fixed;
        left: 16px;
        bottom: 14px;
        font:
          500 12px/1.4 ui-monospace,
          'Cascadia Mono',
          monospace;
        color: rgba(220, 226, 232, 0.72);
        letter-spacing: 0.02em;
        font-variant-numeric: tabular-nums;
        pointer-events: none;
      }
      #passes {
        position: fixed;
        top: 16px;
        right: 16px;
        min-width: 224px;
        padding: 10px 12px 9px;
        border-radius: 10px;
        background: rgba(14, 15, 17, 0.62);
        box-shadow:
          0 0 0 1px rgba(255, 255, 255, 0.07),
          0 8px 24px rgba(0, 0, 0, 0.28);
        backdrop-filter: blur(10px);
        font:
          500 12px/1.55 ui-monospace,
          'Cascadia Mono',
          monospace;
        color: rgba(226, 230, 235, 0.86);
        font-variant-numeric: tabular-nums;
        pointer-events: none;
      }
      #passes .t {
        margin-bottom: 4px;
        color: rgba(226, 230, 235, 0.55);
        letter-spacing: 0.04em;
      }
      #passes .t i {
        font-style: normal;
        opacity: 0.7;
      }
      #passes .r {
        display: flex;
        justify-content: space-between;
        gap: 18px;
      }
      #passes .r b {
        font-weight: 600;
      }
      #passes .sum {
        margin-top: 4px;
        padding-top: 4px;
        border-top: 1px solid rgba(255, 255, 255, 0.1);
      }
      body.clean #hud,
      body.clean #passes,
      body.nopasses #passes {
        display: none;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="hud"></div>
    <div id="passes"></div>
    <script type="module" src="/src/lookdev/main.ts"></script>
  </body>
</html>
